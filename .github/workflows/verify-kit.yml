name: "Antigravity AI-OS: Trust-Grade Master Verification"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: "Master Verification (${{ matrix.os }} - Py ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.13" ]

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: ""

      - name: "Install Python Dependencies (Optional YAML & Tooling)"
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml || true

      - name: "Faz 1: Structural Kit & Lock Integrity"
        run: |
          python .agent/scripts/validate_kit.py

      - name: "Faz 2: 4-Gate Quality Verification"
        run: |
          python .agent/scripts/quality_gates.py . --gate all

      - name: "Faz 3: Comprehensive Contract Test Suite"
        run: |
          python -m unittest discover -s .agent/scripts/tests -p "test_*.py"

      - name: "Faz 4: Master Verification Runner (HUD & JSON)"
        run: |
          python .agent/scripts/verify_kit.py --json
